spring.application.name=chamberwatch
# Errors come back as RFC 9457 problem details.
spring.mvc.problemdetails.enabled=true

# The Postgres from compose.yaml. spring-boot:run and the tests connect to their own containers instead.
spring.datasource.url=jdbc:postgresql://localhost:55432/chamberwatch
spring.datasource.username=chamberwatch
spring.datasource.password=chamberwatch

# Over HTTP the actuator answers /actuator/health and nothing else.
management.endpoints.web.exposure.include=health

# A public demo sets CHAMBERWATCH_READ_ONLY=true, so visitors cannot refit its baseline.
chamberwatch.read-only=false
