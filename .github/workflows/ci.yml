name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the chamber simulator, so the live path is driven against the real binary
        run: make -C ../chamber-sim
      - name: Build and test
        run: ./mvnw -B -ntp verify

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chamber-sim
    steps:
      - uses: actions/checkout@v7
      - name: Build and test with gcc
        run: make CC=gcc test
      - name: Test under the sanitizers
        run: make CC=gcc SAN=1 clean test
      - name: Build and test with clang
        run: make CC=clang clean test
      - name: Drive the real binary over a socket
        run: make CC=gcc clean smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build, then drive the built app
        run: npm run e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the bootstrap would fetch from Zenodo, so here the image starts on an empty database without it
      - name: Build the image and start it next to Postgres
        run: CHAMBERWATCH_BOOTSTRAP=false docker compose up --build --detach
      - name: Check it serves the web app, the API and its health, and refuses a relabel
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && break; sleep 2; done
          curl -sf http://localhost:8080/runs/55 | grep -q 'id="root"'
          curl -sf http://localhost:8080/api/settings | grep -q '"readOnly":true'
          curl -sf http://localhost:8080/api/lots
          status=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' \
            -d '{"label":"GOOD"}' http://localhost:8080/api/runs/1/label)
          test "$status" = 403
      - name: Show the app's log
        if: always()
        run: docker compose logs app
