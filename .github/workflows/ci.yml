name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the chamber simulator, so the live path is driven against the real binary
        run: make -C ../chamber-sim
      - name: Build and test
        run: ./mvnw -B -ntp verify

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chamber-sim
    steps:
      - uses: actions/checkout@v7
      - name: Build and test with gcc
        run: make CC=gcc test
      - name: Test under the sanitizers
        run: make CC=gcc SAN=1 clean test
      - name: Build and test with clang
        run: make CC=clang clean test
      - name: Drive the real binary over a socket
        run: make CC=gcc clean smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build, then drive the built app
        run: npm run e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and start it next to Postgres
        run: docker compose up --build --detach
      - name: Check it serves the API and its health, refuses a relabel, and returns a scored run
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && break; sleep 2; done
          curl -sf http://localhost:8080/actuator/health
          curl -sf http://localhost:8080/api/settings | grep -q '"readOnly":true'
          curl -sf http://localhost:8080/api/lots
          status=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' \
            -d '{"label":"GOOD"}' http://localhost:8080/api/runs/1/label)
          test "$status" = 403
          # health answers before bootstrap has scored the public runs
          deadline=$((SECONDS + 1800))
          id=
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl -sf --max-time 30 "http://localhost:8080/api/runs?source=PUBLIC" || true)
            id=$(printf '%s' "$body" | python3 -c '
          import json, sys
          raw = sys.stdin.read()
          if not raw.strip():
              raise SystemExit(0)
          try:
              page = json.loads(raw)
          except json.JSONDecodeError:
              raise SystemExit(0)
          if not isinstance(page, dict):
              raise SystemExit(0)
          for row in page.get("runs") or []:
              if not isinstance(row, dict) or row.get("scored") is not True:
                  continue
              found = row.get("id")
              if isinstance(found, int):
                  print(found)
                  break
          ')
            if [ -n "$id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$id" ]; then
            echo "no scored public run within 30 minutes" >&2
            exit 1
          fi
          curl -sf "http://localhost:8080/api/runs/${id}" | python3 -c '
          import json, sys
          detail = json.loads(sys.stdin.read())
          assessment = detail.get("assessment") if isinstance(detail, dict) else None
          if not isinstance(assessment, dict) or "limitFlags" not in assessment:
              raise SystemExit("run has no assessment with limitFlags")
          '
      - name: Show the app's log
        if: always()
        run: docker compose logs app
